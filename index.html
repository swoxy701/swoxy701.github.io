<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>İclal, Özür Dilerim 💔</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffe6ec, #f0f7ff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: "Segoe UI", sans-serif;
  }

  h1 {
    font-size: 24px;
    color: #222;
    margin-bottom: 10px;
    text-align: center;
  }

  p {
    text-align: center;
    color: #444;
    margin: 0 20px 20px;
    font-size: 16px;
  }

  .btns {
    display: flex;
    gap: 15px;
    justify-content: center;
  }

  button {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    color: white;
    transition: transform 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  #yes { background: #22c55e; }
  #no { background: #ef4444; }

  .message {
    text-align: center;
    font-size: 18px;
    color: #222;
    margin-top: 20px;
  }

  .heart, .broken-heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 4s linear forwards;
    opacity: 0.8;
  }

  .heart { color: #ff4d6d; }
  .broken-heart { color: #a00; }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0.9; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

  <h1>İclal 💔</h1>
  <p>Seni kırdığım için gerçekten çok üzgünüm.<br>Beni affeder misin?</p>

  <div class="btns">
    <button id="yes">Evet 💖</button>
    <button id="no">Hayır 😔</button>
  </div>

  <div class="message" id="msg"></div>

  <script>
    // Uçan kalpler
    function createHeart(type="heart") {
      const el = document.createElement("div");
      el.classList.add(type);
      el.textContent = type === "heart" ? "💖" : "💔";
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }

    // Sürekli normal uçan kalpler
    const normalHearts = setInterval(()=>createHeart("heart"), 300);

    const msg = document.getElementById("msg");

    document.getElementById("yes").onclick = () => {
      msg.innerHTML = "💞 Teşekkür ederimmmm💕";
      // Kalpler çoğalsın
      const yesHearts = setInterval(()=>createHeart("heart"), 100);
      setTimeout(()=>clearInterval(yesHearts), 5000);
    };

    document.getElementById("no").onclick = () => {
      msg.innerHTML = "😔 Üzdüğüm için çok pişmanım...";
      // Kırık kalpler yağsın
      const brokenHearts = setInterval(()=>createHeart("broken-heart"), 150);
      setTimeout(()=>clearInterval(brokenHearts), 5000);
    };
  </script>

</body>
</html>
